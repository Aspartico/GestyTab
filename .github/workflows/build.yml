name: Build Windows exe e installer
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name ArcaNote --icon assets/arcanote.ico --add-data "assets/arcanote.ico;assets" arcanote.py
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\arcanote.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ArcaNote-windows
          path: |
            dist/ArcaNote-Setup.exe
            dist/ArcaNote.exe
      - name: Pubblica release con i file .exe diretti
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versione --cleanup-tag -y || true
          gh release create ultima-versione dist/ArcaNote-Setup.exe dist/ArcaNote.exe \
            --target "$GITHUB_SHA" --title "ArcaNote - ultima versione" \
            --notes "ArcaNote-Setup.exe = installer (consigliato). ArcaNote.exe = versione portable."
